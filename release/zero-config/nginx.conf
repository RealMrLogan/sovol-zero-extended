# Installed by sovol-zero-extended as /etc/nginx/snippets/zero-extended.conf, included in Mainsail's site.
# The config page at /extended/, allowed for whoever Moonraker allows (trusted clients or a logged-in user).
location = /extended { return 301 /extended/; }
location ^~ /extended/ {
    auth_request /extended-auth;
    proxy_pass http://127.0.0.1:7130/;
    proxy_http_version 1.1;
    proxy_read_timeout 120;
}
location = /extended-auth {
    internal;
    proxy_pass http://apiserver/access/user;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
