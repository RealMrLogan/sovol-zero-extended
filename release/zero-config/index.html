<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Extended</title>
<style>
  :root { color-scheme: dark; --bg: #121212; --card: #1e1e1e; --line: #2c2c2c; --text: #e6e6e6;
          --muted: #9a9a9a; --accent: #d41216; --ok: #4caf50; --err: #ef5350; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  header a { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; font-family: ui-monospace, monospace; font-size: 13px; overflow-wrap: anywhere; }
  .setting + .setting { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
  .setting label { font-weight: 600; display: block; }
  .setting p { color: var(--muted); margin: 2px 0 10px; font-size: 14px; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
                    padding: 8px 14px; font: inherit; cursor: pointer; }
  .choices button:hover:not(:disabled) { border-color: var(--muted); }
  .choices button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .choices button:disabled { opacity: .5; cursor: wait; }
  .msg { min-height: 1.5em; margin-top: 8px; font-size: 14px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn:focus-visible, .choices button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  pre { background: #0b0b0b; border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 12px 0 0;
        max-height: 360px; overflow: auto; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <header><h1>Sovol Zero Extended</h1><a href="/">Back to Mainsail</a></header>
  <section class="card"><h2>Installed</h2><dl id="status"><dt>Loading…</dt><dd></dd></dl></section>
  <section class="card"><h2>Settings</h2><div id="settings"></div></section>
  <section class="card" aria-labelledby="update-h">
    <h2 id="update-h">Update</h2>
    <p class="note">Install a release zip from GitHub. Boards are only flashed if the release changes their firmware;
      anything that doesn't come back is rolled back. Don't power off the printer while it runs.</p>
    <div class="row">
      <input type="file" id="file" accept=".zip,application/zip" hidden>
      <button type="button" class="btn secondary" id="pick">Choose release zip…</button>
      <button type="button" class="btn" id="install" hidden>Install</button>
    </div>
    <div class="msg" id="update-msg" role="status" aria-live="polite"></div>
    <pre id="log" hidden></pre>
  </section>
</main>
<script>
const $ = (sel) => document.querySelector(sel);
const text = (tag, s, cls) => { const e = document.createElement(tag); e.textContent = s; if (cls) e.className = cls; return e; };

function renderStatus(st) {
  const dl = $("#status"); dl.replaceChildren();
  const rows = [["Release", st.version], ...Object.entries(st.boards).map(([b, v]) => [b[0].toUpperCase() + b.slice(1), v])];
  for (const [k, v] of rows) dl.append(text("dt", k), text("dd", v || "unknown"));
}

function renderSetting(key, s) {
  const box = document.createElement("div"); box.className = "setting";
  const msg = text("div", s.error || "", "msg" + (s.error ? " err" : ""));
  const choices = document.createElement("div"); choices.className = "choices";
  choices.setAttribute("role", "group"); choices.setAttribute("aria-label", s.label);
  const buttons = () => choices.querySelectorAll("button");
  const setEnabled = (on) => buttons().forEach((x) => (x.disabled = !on));
  for (const [value, label] of Object.entries(s.choices)) {
    const b = text("button", label); b.type = "button";
    b.dataset.value = value;
    b.setAttribute("aria-pressed", String(value === s.value));
    b.onclick = async () => {
      if (value === s.value) return;
      setEnabled(false);
      msg.className = "msg"; msg.textContent = s.applying;
      try {
        const r = await fetch("api/settings/" + key, { method: "POST", headers: { "Content-Type": "application/json" },
                                                       body: JSON.stringify({ value }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || r.statusText);
        s.value = d.value;
        buttons().forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.value === s.value)));
        msg.className = "msg ok"; msg.textContent = "Applied.";
      } catch (e) { msg.className = "msg err"; msg.textContent = "Failed: " + e.message; }
      setEnabled(true);
    };
    choices.append(b);
  }
  box.append(text("label", s.label), text("p", s.help), choices, msg);
  return box;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const setUpdateMsg = (s, cls) => { const m = $("#update-msg"); m.className = "msg" + (cls ? " " + cls : ""); m.textContent = s; };

function load() {   // status and settings; again after an install, which can change both
  return fetch("api/settings").then((r) => { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.json(); })
    .then((d) => {
      renderStatus(d.status);
      $("#settings").replaceChildren(...Object.entries(d.settings).map(([k, s]) => renderSetting(k, s)));
    })
    .catch((e) => { $("#settings").replaceChildren(text("div", "Could not load settings: " + e.message, "msg err")); });
}

function showPending(p) {
  $("#install").hidden = !p;
  if (p) setUpdateMsg("Ready to install " + p.version + (p.commit ? " (" + p.commit + ")" : "") + ".");
}

async function follow() {   // poll the install; the page's own server may restart mid-install, so ride out errors
  $("#pick").disabled = true; $("#install").hidden = true; $("#log").hidden = false;
  setUpdateMsg("Installing…");
  for (;;) {
    try {
      const d = await (await fetch("api/update")).json();
      $("#log").textContent = d.log; $("#log").scrollTop = $("#log").scrollHeight;
      if (!d.running && d.result) {
        if (d.result === "success") setUpdateMsg("Installed.", "ok"); else setUpdateMsg("Install failed; see the log. The previous release was put back.", "err");
        break;
      }
    } catch (e) { /* server restarting */ }
    await sleep(1500);
  }
  $("#pick").disabled = false;
  load();
}

$("#pick").onclick = () => $("#file").click();
$("#file").onchange = async () => {
  const f = $("#file").files[0]; $("#file").value = "";
  if (!f) return;
  $("#pick").disabled = true; $("#install").hidden = true; setUpdateMsg("Uploading " + f.name + "…");
  try {
    const r = await fetch("api/update/upload", { method: "POST", headers: { "Content-Type": "application/zip" }, body: f });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    showPending(d);
  } catch (e) { setUpdateMsg("Upload failed: " + e.message, "err"); }
  $("#pick").disabled = false;
};
$("#install").onclick = async () => {
  $("#install").disabled = true;
  try {
    const r = await fetch("api/update/install", { method: "POST" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    follow();
  } catch (e) { setUpdateMsg("Could not start the install: " + e.message, "err"); }
  $("#install").disabled = false;
};

fetch("api/update").then((r) => r.json()).then((d) => {
  if (d.running) follow();
  else showPending(d.pending);
}).catch(() => {});

load();
</script>
</body>
</html>
