# System packages each release installs, offline, from Debian's own .deb files (make-release.sh downloads and
# checks them; install.sh can't reach apt). Only for packages the printer lacks whose dependencies it already
# has: install.sh checks both (apt simulation) before changing anything, and purges what it added on rollback.
#
# package        version            sha256                                                            url
# gir1.2-nm-1.0: libnm's GObject bindings, for KlipperScreen's network panel (without it, KlipperScreen falls
# back to its older sdbus code). Same version as the printer's libnm0.
gir1.2-nm-1.0    1.30.6-1+deb11u1   9a0e4ddd898261ae5ce6aa52e0f443e60930ce82f6a7eddb1f2f243c1583027a  https://archive.debian.org/debian/pool/main/n/network-manager/gir1.2-nm-1.0_1.30.6-1+deb11u1_arm64.deb
# kbd: chvt, which KlipperScreen's service runs after starting (ExecStartPost=+chvt 7); its installer adds kbd
# when the printer has a VT, as the Zero does. Its install scripts only add /usr/bin symlinks.
kbd              2.3.0-3            69ad60576ec04af9a7b7f646fbd4c0337d3acda5bf6ddcfdce959011d97d5651  https://archive.debian.org/debian/pool/main/k/kbd/kbd_2.3.0-3_arm64.deb
