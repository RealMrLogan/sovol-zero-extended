# Installed by sovol-zero-extended as /etc/systemd/system/crowsnest.service.d/zero-extended.conf.
# Sovol's image delays crowsnest by 6 s (edited into crowsnest's own service template); kept here as a
# drop-in so ~/crowsnest stays pure upstream. The empty line resets any ExecStartPre the unit already has.
[Service]
ExecStartPre=
ExecStartPre=/bin/sleep 6
