name: release

# Two channels:
#  - nightly: every push to main (or "Run workflow") rebuilds the `nightly` prerelease from that commit.
#    Untested, for test printers only. Its version is generated, e.g. v0.2.1-3-gabc1234 (3 commits after v0.2.1).
#  - releases: push a tag like v0.2.0 (or v0.2.0-rc.1) to build the zip and open a DRAFT release.
#    Install the draft on a printer (tools/install-release.sh <tag>), then publish it by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:            # a newer push to main replaces a nightly build still running
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  wheels:   # Python packages for apps whose pin changes their requirements (tools/build-wheels.sh); usually none
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.need.outputs.apps != '' }}
    steps:
      - uses: actions/checkout@v7
      - id: need
        run: echo "apps=$(tools/build-wheels.sh -n)" >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.apps != ''
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Build wheels for the printer (arm64, Debian 11, Python 3.9)
        if: steps.need.outputs.apps != ''
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/w" -w /w debian:bullseye bash -euc '
            printf "%s\n" "deb http://archive.debian.org/debian bullseye main" \
                           "deb http://archive.debian.org/debian-security bullseye-security main" > /etc/apt/sources.list
            apt-get update -q
            apt-get install -y -q --no-install-recommends ca-certificates git python3-venv python3-dev gcc pkg-config libcairo2-dev libgirepository1.0-dev
            git config --global --add safe.directory "*"
            tools/build-wheels.sh wheels'
      - if: steps.need.outputs.apps != ''
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheels/

  release:
    needs: wheels
    runs-on: ubuntu-latest
    # Debian 11 ships arm-none-eabi-gcc 15:8-2019-q3-1+b1, the compiler Sovol built the stock images with
    container: debian:bullseye
    steps:
      - name: Install toolchain
        run: |
          # Debian 11 is end-of-life; archive.debian.org keeps it (and this exact compiler) permanently
          printf '%s\n' 'deb http://archive.debian.org/debian bullseye main' \
                        'deb http://archive.debian.org/debian-security bullseye-security main' > /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make cpp python3 gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi curl rsync xz-utils
          arm-none-eabi-gcc --version | head -1
          # downloaded tools are checked against pinned SHA-256s: this job can publish releases
          curl -fsSLo /tmp/gh.tar.gz https://github.com/cli/cli/releases/download/v2.104.0/gh_2.104.0_linux_amd64.tar.gz
          echo "98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e  /tmp/gh.tar.gz" | sha256sum -c
          tar -xzf /tmp/gh.tar.gz -C /tmp
          echo /tmp/gh_2.104.0_linux_amd64/bin >> "$GITHUB_PATH"
          # the shellcheck tools/test.sh is checked with locally; Debian 11's 0.7.1 warns about things it doesn't
          curl -fsSLo /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          echo /tmp/shellcheck-v0.11.0 >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0    # tags, for the nightly version

      - if: needs.wheels.outputs.built == 'true'
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: wheels

      - name: Test
        shell: bash
        run: tools/test.sh

      - name: Build (fails unless the toolhead build is byte-identical to stock)
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME
          else version=$(git describe --tags --long --match 'v*'); fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          WHEELS=$PWD/wheels tools/make-release.sh "$version"

      - name: Publish nightly
        if: github.ref_type == 'branch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly -R "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly --prerelease --latest=false --target "$GITHUB_SHA" \
            -R "$GITHUB_REPOSITORY" --title "nightly ($VERSION)" \
            --notes "Untested build of the latest \`main\`, rebuilt on every push. For testing only." \
            dist/*.zip dist/*.zip.sha256

      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="$GITHUB_REF_NAME" '$1 == "##" {p = ($2 == v)} p' CHANGELOG.md)
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --draft $prerelease \
            -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}" \
            dist/*.zip dist/*.zip.sha256
