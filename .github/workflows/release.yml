name: release

# Push a tag like v0.2.0 (or v0.2.0-rc.1) to build a release zip and open a DRAFT release.
# Install the draft on a printer (tools/install-release.sh <tag>), then publish it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # "Run workflow" button: test build only, uploads the zip as a CI artifact
    inputs:
      version:
        description: version to stamp (e.g. v0.0.0-test)
        default: v0.0.0-test

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Debian 11 ships arm-none-eabi-gcc 15:8-2019-q3-1+b1, the compiler Sovol built the stock images with
    container: debian:bullseye
    steps:
      - name: Install toolchain
        run: |
          # Debian 11 is end-of-life; archive.debian.org keeps it (and this exact compiler) permanently
          printf '%s\n' 'deb http://archive.debian.org/debian bullseye main' \
                        'deb http://archive.debian.org/debian-security bullseye-security main' > /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make cpp python3 gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi curl
          arm-none-eabi-gcc --version | head -1

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build release (fails unless the toolhead build is byte-identical to stock)
        run: |
          git config --global --add safe.directory '*'
          tools/make-release.sh "${{ inputs.version || github.ref_name }}"

      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: dist/

      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz | tar -xz -C /tmp
          notes=$(awk -v v="$GITHUB_REF_NAME" '$1 == "##" {p = ($2 == v)} p' CHANGELOG.md)
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          /tmp/gh_2.63.2_linux_amd64/bin/gh release create "$GITHUB_REF_NAME" --draft $prerelease \
            -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}" \
            dist/*.zip dist/*.zip.sha256
        shell: bash
